type: opensearch
display_name: OpenSearch Exporter

status:
  class: exporter
  stability:
    alpha: [traces, logs]
  distributions: [contrib]
  codeowners:
    active: [ps48]
    emeritus: [Aneurysm9, MitchellGale, MaxKsyunz, YANG-DB]
    seeking_new: true

tests:
  expect_consumer_error: true
  config:
    # Lifecycle coverage has no OpenSearch server; retry behavior has dedicated tests.
    retry_on_failure:
      enabled: false
    http:
      endpoint: http://127.0.0.1:1
