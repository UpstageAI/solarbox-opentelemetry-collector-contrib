note: Preserve retryable bulk failures and provide an opt-in Studio mapping for direct OpenSearch ingestion without Data Prepper.
issues: [132]
subtext: |
  Bulk request buffers remain valid when a server responds before reading the complete payload.
  Studio mode keeps typed OTLP fields and stable document IDs for idempotent retries.
  The optional Studio distribution includes only the components required for this path;
  existing ClickHouse distributions and default OpenSearch mappings are unchanged.
